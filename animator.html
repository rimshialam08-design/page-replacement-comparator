<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page replacement lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#202e2b;font:16px/1.5 "DM Sans",system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:5vh 5vw}h1{font:clamp(36px,6vw,72px)/1.05 Georgia,serif;letter-spacing:-.055em;margin:0 0 32px}label,small{font-size:.85rem}label{display:block;font-weight:700}select,button{font:inherit;border:1px solid #85968c;border-radius:7px;padding:8px 14px;background:#fff;color:inherit}select{max-width:100%;margin-top:5px}button{cursor:pointer}button:disabled{opacity:.42;cursor:default}#play{background:#174c41;color:white}.strip,nav,.slots{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.strip{margin:12px 0;min-height:40px}.chip,.slot{display:grid;place-items:center;background:#fff;border:1px solid #c5cbc1;border-radius:7px;min-width:36px;height:38px}.current{background:#174c41;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}article{background:#fff;border:1px solid #c4c9be;border-radius:14px;padding:18px}h2{margin:0;font:32px Georgia,serif}.rule{color:#52625b;min-height:3em;margin:6px 0 16px}.slot{background:#f2f3ed;min-width:40px;height:48px;font-weight:700}.fault{background:#ffe3bc;border-color:#b46a1b}.hit{background:#c9ebde;border-color:#40846e}.changed{animation:arrive .32s ease-out}@keyframes arrive{from{transform:translateY(-6px);opacity:.45}}@media(prefers-reduced-motion:reduce){.changed{animation:none}}@media(max-width:740px){.cards{grid-template-columns:1fr}.rule{min-height:0}}p{margin:12px 0}hr{border:0;border-top:1px solid #ccd1c7;margin:20px 0}
</style>
<main>
<h1>Page replacement lab</h1>
<label for="preset">Test case</label><select id="preset"></select>
<p id="position"></p><div class="strip" id="requests" aria-label="Page requests"></div>
<nav aria-label="Playback"><button id="back">Previous</button><button id="next">Next step</button><button id="play">Play</button><button id="reset">Reset</button></nav>
<div id="cards" class="cards" aria-live="polite"></div>
</main>
<script>
const anomaly = [1,2,3,4,1,2,5,1,2,3,4,5];
const cases = [
  ["Empty stream",3,[]], ["Repeated page",1,[0,0,0]],
  ["One frame",1,[1,2,2,1]], ["Spare frames",5,[1,2,1,3]],
  ["Hit refreshes recency",2,[1,2,1,3,1]],
  ["Anomaly with three frames",3,anomaly], ["Anomaly with four frames",4,anomaly]
];
const policies = ["FIFO","LRU","Optimal"];
const rules = ["Remove the earliest arrival.","Remove the page used longest ago.","Remove the page needed farthest in the future."];
function simulate(pages, capacity, policy) {
  const frames = [];
  let faults = 0;
  const history = [{slots:[], slot:-1, faults, message:"Frames are empty."}];
  for (let step = 0; step < pages.length; step++) {
    const page = pages[step];
    let slot = frames.findIndex(frame => frame.page === page);
    const hit = slot !== -1;
    let message;
    if (hit) {
      frames[slot].used = step;
      message = "Hit. Page " + page + " is already here.";
    } else {
      faults++;
      slot = frames.length;
      message = "Fault. Load page " + page + " into a free frame.";
      if (frames.length === capacity) {
        slot = 0;
        if (policy === "Optimal") {
          let farthest = -1;
          for (let i = 0; i < frames.length; i++) {
            const next = pages.indexOf(frames[i].page, step + 1);
            if (next === -1) { slot = i; break; }
            if (next > farthest) { farthest = next; slot = i; }
          }
          const next = pages.indexOf(frames[slot].page, step + 1);
          message = next === -1 ? "it never appears again." : "its next use is farthest away (step " + (next+1) + ").";
        } else {
          const field = policy === "FIFO" ? "arrived" : "used";
          for (let i = 1; i < frames.length; i++) {
            if (frames[i][field] < frames[slot][field]) slot = i;
          }
          message = policy === "FIFO" ? "it arrived first." : "its last use was earliest.";
        }
        message = "Fault. Replace " + frames[slot].page + " with " + page + " because " + message;
      }
      frames[slot] = {page, arrived:step, used:step};
    }
    history.push({slots:frames.map(frame => frame.page),slot,hit,faults,message});
  }
  return history;
}
const get = id => document.getElementById(id);
const preset = get("preset");
cases.forEach(([name],i) => preset.add(new Option((i+1)+". "+name,i)));
preset.value = 4;
let step = 0, timer = null, histories = [];
function stop() { clearInterval(timer); timer = null; }
function loadCase() {
  stop();
  step = 0;
  const [,capacity,pages] = cases[preset.value];
  histories = policies.map(policy => simulate(pages,capacity,policy));
  render();
}
function render() {
  const [,capacity,pages] = cases[preset.value];
  const end = step === pages.length;
  if (end) stop();
  get("position").textContent = capacity+" frames · Step "+step+" of "+pages.length+
    (step ? " · Requested page "+pages[step-1] : "");
  get("requests").innerHTML = pages.map((page,i) =>
    '<span class="chip '+(i===step-1?"current":"")+'">'+page+'</span>').join("") || "No page requests.";
  get("cards").innerHTML = policies.map((policy,i) => {
    const state = histories[i][step];
    let slots = "";
    for (let j=0; j<capacity; j++) {
      const color = j===state.slot ? (state.hit?"hit changed":"fault changed") : "";
      slots += '<span class="slot '+color+'">'+(state.slots[j] ?? "–")+'</span>';
    }
    return '<article><h2>'+policy+'</h2><p class="rule">'+rules[i]+'</p><div class="slots">'+slots+
      '</div><p>'+state.message+'</p><hr><strong>'+state.faults+' faults</strong> · '+(step-state.faults)+' hits</article>';
  }).join("");
  get("back").disabled = get("reset").disabled = step===0 && !timer;
  get("next").disabled = get("play").disabled = end;
  get("play").textContent = timer ? "Pause" : "Play";
}
preset.onchange = loadCase;
get("next").onclick = () => {stop(); step++; render();};
get("back").onclick = () => {stop(); step=Math.max(0,step-1); render();};
get("reset").onclick = loadCase;
get("play").onclick = () => {
  if (timer) stop();
  else timer = setInterval(() => {step++; render();},1200);
  render();
};
loadCase();
</script>
</html>
